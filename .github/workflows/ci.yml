name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository formatting
        run: pnpm format:check
      - name: Lint shared packages and both Next apps
        run: pnpm --filter @shsg/api-client --filter @shsg/ui --filter @shsg/website --filter @shsg/app lint
      - name: Generate Next route types for a clean checkout
        run: |
          pnpm --filter @shsg/website exec next typegen
          pnpm --filter @shsg/app exec next typegen
      - name: Typecheck shared packages and both Next apps
        run: pnpm --filter @shsg/api-client --filter @shsg/ui --filter @shsg/website --filter @shsg/app typecheck
      - name: Test shared packages and frontend interactions
        run: pnpm --filter @shsg/api-client --filter @shsg/ui --filter @shsg/website --filter @shsg/app test
      - name: Build website
        run: pnpm --filter @shsg/website build
      - name: Build operations app
        run: pnpm --filter @shsg/app build

  api:
    name: API and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      SHSG_DATABASE_HOST: 127.0.0.1
      SHSG_DATABASE_PORT: '5432'
      SHSG_DATABASE_NAME: shsg_ci
      SHSG_DATABASE_USER: shsg_ci
      SHSG_DATABASE_PASSWORD: ci_only_password
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shsg_ci
          POSTGRES_USER: shsg_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shsg_ci -d shsg_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies and verify the lockfile
        run: uv sync --locked --dev
      - name: Lint Python and check formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Typecheck API and migration environment
        run: uv run --frozen mypy src migrations
      - name: Run unit and API tests
        run: uv run --frozen pytest -m 'not integration'
      - name: Apply migrations to a fresh PostgreSQL database
        run: uv run --frozen alembic upgrade head
      - name: Verify repeated upgrades and current revision
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic current --check-heads
      - name: Detect model changes missing a migration
        run: uv run --frozen alembic check
      - name: Run PostgreSQL integration tests
        run: uv run --frozen pytest -m integration

  compose:
    name: Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: shsg-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: shsg_ci
      POSTGRES_USER: shsg_ci
      POSTGRES_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start database, migration runner, and API
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify API liveness and database readiness
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          for path, expected in [
              ("health", {"status": "ok"}),
              ("ready", {"status": "ready", "database": "ok"}),
          ]:
              with urllib.request.urlopen(f"http://127.0.0.1:8000/{path}", timeout=5) as response:
                  assert response.status == 200
                  assert json.load(response) == expected
          PY
      - name: Check migrations inside the built image
        run: |
          docker compose run --rm migrate alembic current --check-heads
          docker compose run --rm migrate alembic check
      - name: Verify database persistence across container recreation
        run: |
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE ci_persistence_probe (value text PRIMARY KEY);
          INSERT INTO ci_persistence_probe VALUES ('survives_recreation');
          SQL
          docker compose down
          docker compose up --detach --wait --wait-timeout 180
          result="$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT value FROM ci_persistence_probe')"
          test "$result" = "survives_recreation"
      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Remove this job's containers and database volume
        if: always()
        run: docker compose down --volumes --remove-orphans

  required:
    name: Required checks
    if: always()
    needs: [frontend, api, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      API_RESULT: ${{ needs.api.result }}
      COMPOSE_RESULT: ${{ needs.compose.result }}
    steps:
      - name: Require every CI job to pass
        run: |
          test "$FRONTEND_RESULT" = success
          test "$API_RESULT" = success
          test "$COMPOSE_RESULT" = success
