name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch deployment halfway through its migration.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository formatting
        run: pnpm format:check
      - name: Lint shared packages and both Next apps
        run: pnpm --filter @shsg/api-client --filter @shsg/ui --filter @shsg/website --filter @shsg/app lint
      - name: Generate Next route types for a clean checkout
        run: |
          pnpm --filter @shsg/website exec next typegen
          pnpm --filter @shsg/app exec next typegen
      - name: Typecheck shared packages and both Next apps
        run: pnpm --filter @shsg/api-client --filter @shsg/ui --filter @shsg/website --filter @shsg/app typecheck
      - name: Test shared packages and frontend interactions
        run: pnpm --filter @shsg/api-client --filter @shsg/ui --filter @shsg/website --filter @shsg/app test
      - name: Build website
        run: pnpm --filter @shsg/website build
      - name: Build operations app
        run: pnpm --filter @shsg/app build

  api:
    name: API and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    env:
      SHSG_DATABASE_HOST: 127.0.0.1
      SHSG_DATABASE_PORT: '5432'
      SHSG_DATABASE_NAME: shsg_ci
      SHSG_DATABASE_USER: shsg_ci
      SHSG_DATABASE_PASSWORD: ci_only_password
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: shsg_ci
          POSTGRES_USER: shsg_ci
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shsg_ci -d shsg_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies and verify the lockfile
        run: uv sync --locked --dev
      - name: Lint Python and check formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Typecheck API and migration environment
        run: uv run --frozen mypy src migrations
      - name: Run unit and API tests
        run: uv run --frozen pytest -m 'not integration'
      - name: Apply migrations to a fresh PostgreSQL database
        run: uv run --frozen alembic upgrade head
      - name: Verify repeated upgrades and current revision
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic current --check-heads
      - name: Detect model changes missing a migration
        run: uv run --frozen alembic check
      - name: Run PostgreSQL integration tests
        run: uv run --frozen pytest -m integration

  compose:
    name: Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: shsg-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: shsg_ci
      POSTGRES_USER: shsg_ci
      POSTGRES_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start database, migration runner, and API
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify API liveness and database readiness
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          for path, expected in [
              ("health", {"status": "ok"}),
              ("ready", {"status": "ready", "database": "ok"}),
          ]:
              with urllib.request.urlopen(f"http://127.0.0.1:8000/{path}", timeout=5) as response:
                  assert response.status == 200
                  assert json.load(response) == expected
          PY
      - name: Check migrations inside the built image
        run: |
          docker compose run --rm migrate alembic current --check-heads
          docker compose run --rm migrate alembic check
      - name: Verify database persistence across container recreation
        run: |
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE ci_persistence_probe (value text PRIMARY KEY);
          INSERT INTO ci_persistence_probe VALUES ('survives_recreation');
          SQL
          docker compose down
          docker compose up --detach --wait --wait-timeout 180
          result="$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT value FROM ci_persistence_probe')"
          test "$result" = "survives_recreation"
      - name: Show service state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Remove this job's containers and database volume
        if: always()
        run: docker compose down --volumes --remove-orphans

  production:
    name: Production containers
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IMAGE_REGISTRY: shsg-ci
      IMAGE_TAG: smoke
      POSTGRES_PASSWORD: ci_only_password
      SHSG_AUTH_JWT_SECRET: ci-only-production-secret-at-least-32-characters
      SHSG_APP_URL: ${{ vars.SHSG_APP_URL || 'http://localhost:9002' }}
      SHSG_CORS_ORIGINS: ${{ vars.SHSG_CORS_ORIGINS || 'http://localhost:9001,http://localhost:9002' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check deployment tooling
        run: |
          bash -n deploy/deploy.sh
          node --check deploy/smoke-test.mjs
          docker compose -f deploy/compose.production.yml config --quiet
      - name: Require explicit URLs when building a release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        env:
          CONFIGURED_APP_URL: ${{ vars.SHSG_APP_URL }}
          CONFIGURED_CORS_ORIGINS: ${{ vars.SHSG_CORS_ORIGINS }}
        run: |
          test -n "$CONFIGURED_APP_URL" || { echo 'Set the SHSG_APP_URL repository variable'; exit 1; }
          test -n "$CONFIGURED_CORS_ORIGINS" || { echo 'Set the SHSG_CORS_ORIGINS repository variable'; exit 1; }
      - name: Build both standalone frontends and API
        run: |
          for app in website app; do
            docker build --file deploy/Dockerfile.frontend --build-arg "APP=$app" \
              --build-arg "SHSG_APP_URL=$SHSG_APP_URL" --tag "$IMAGE_REGISTRY/shsg-$app:$IMAGE_TAG" .
          done
          docker build --tag "$IMAGE_REGISTRY/shsg-api:$IMAGE_TAG" apps/api
      - name: Start production stack and apply migrations
        run: docker compose -f deploy/compose.production.yml up --detach --wait --wait-timeout 240
      - name: Verify rendered pages, API proxy, signup and login
        run: node deploy/smoke-test.mjs
      - name: Package the tested images for deployment
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        run: |
          docker image save "$IMAGE_REGISTRY/shsg-website:$IMAGE_TAG" \
            "$IMAGE_REGISTRY/shsg-app:$IMAGE_TAG" "$IMAGE_REGISTRY/shsg-api:$IMAGE_TAG" \
            | gzip > "$RUNNER_TEMP/shsg-images.tar.gz"
      - name: Preserve the exact images that passed the smoke test
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-images
          path: ${{ runner.temp }}/shsg-images.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Show production logs on failure
        if: failure()
        run: docker compose -f deploy/compose.production.yml logs --no-color
      - name: Remove isolated production smoke stack
        if: always()
        run: docker compose -f deploy/compose.production.yml down --volumes --remove-orphans

  required:
    name: Required checks
    if: always()
    needs: [frontend, api, compose, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      API_RESULT: ${{ needs.api.result }}
      COMPOSE_RESULT: ${{ needs.compose.result }}
      PRODUCTION_RESULT: ${{ needs.production.result }}
    steps:
      - name: Require every CI job to pass
        run: |
          test "$FRONTEND_RESULT" = success
          test "$API_RESULT" = success
          test "$COMPOSE_RESULT" = success
          test "$PRODUCTION_RESULT" = success

  deploy:
    name: Deploy EC2
    needs: [required]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.required.result == 'success' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: shsg-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      UPLOAD_DIRECTORY: /tmp/shsg-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate deployment settings
        id: ssh_identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_KEY_PASSPHRASE: ${{ secrets.DEPLOY_KEY_PASSPHRASE }}
        run: |
          test -n "$SSH_HOST" || { echo 'Set SSH_HOST in the production environment'; exit 1; }
          test -n "$SSH_USER" || { echo 'Set SSH_USER in the production environment'; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo 'Set SSH_PRIVATE_KEY in the production environment'; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo 'Set SSH_KNOWN_HOSTS in the production environment'; exit 1; }
          known_hosts="$(mktemp)"
          trap 'rm -f "$known_hosts"' EXIT
          umask 077
          key_file="$RUNNER_TEMP/shsg_deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          if ! ssh-keygen -y -P "$DEPLOY_KEY_PASSPHRASE" -f "$key_file" > /dev/null 2>&1; then
            echo '::error::SSH_PRIVATE_KEY in the production environment is not a valid private key, or DEPLOY_KEY_PASSPHRASE is incorrect. Paste the full private key, including BEGIN/END lines, without quotes.'
            exit 1
          fi
          printf 'key_file=%s\n' "$key_file" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known_hosts"
          host_keys="$(ssh-keygen -F "$SSH_HOST" -f "$known_hosts")" || { echo '::error::SSH_KNOWN_HOSTS has no entry for SSH_HOST. Update it with the verified current EC2 host key.'; exit 1; }
          # Match the host-key preference used by the actions' Go SSH client.
          # SSH_KNOWN_HOSTS should contain all active host public keys from EC2.
          selected_key=''
          for algorithm in ecdsa-sha2-nistp256 ecdsa-sha2-nistp384 ecdsa-sha2-nistp521 ssh-rsa ssh-ed25519; do
            selected_key="$(printf '%s\n' "$host_keys" | awk -v algorithm="$algorithm" '$2 == algorithm { print; exit }')"
            if [ -n "$selected_key" ]; then
              break
            fi
          done
          test -n "$selected_key" || { echo '::error::No supported host key found in SSH_KNOWN_HOSTS'; exit 1; }
          printf '%s\n' "$selected_key" > "$known_hosts"
          fingerprint="$(ssh-keygen -lf "$known_hosts" -E sha256 | awk 'NR == 1 {print $2}')"
          test -n "$fingerprint" || { echo 'SSH_KNOWN_HOSTS must contain a verified SSH host key'; exit 1; }
          printf 'Verifying server host key: %s %s\n' "$algorithm" "$fingerprint"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_REGISTRY=ghcr.io/%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: actions/download-artifact@v4
        with:
          name: production-images
          path: ${{ runner.temp }}
      - name: Publish the production images that passed CI
        run: |
          docker image load --input "$RUNNER_TEMP/shsg-images.tar.gz"
          for service in website app api; do
            docker image tag "shsg-ci/shsg-$service:smoke" "$IMAGE_REGISTRY/shsg-$service:$GITHUB_SHA"
            docker image push "$IMAGE_REGISTRY/shsg-$service:$GITHUB_SHA"
          done
      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ steps.ssh_identity.outputs.key_file }}
          passphrase: ${{ secrets.DEPLOY_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.ssh_identity.outputs.fingerprint }}
          source: deploy/compose.production.yml,deploy/deploy.sh
          target: ${{ env.UPLOAD_DIRECTORY }}
          strip_components: 1
      - name: Deploy through verified SSH and wait for healthy services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ steps.ssh_identity.outputs.key_file }}
          passphrase: ${{ secrets.DEPLOY_KEY_PASSPHRASE }}
          fingerprint: ${{ steps.ssh_identity.outputs.fingerprint }}
          command_timeout: 20m
          envs: IMAGE_REGISTRY,GITHUB_SHA,UPLOAD_DIRECTORY
          script: |
            set -eu
            release="/opt/shsg/releases/$GITHUB_SHA"
            sudo -n install -d -m 700 "$release"
            sudo -n install -m 600 "$UPLOAD_DIRECTORY/compose.production.yml" "$release/compose.production.yml"
            sudo -n install -m 600 "$UPLOAD_DIRECTORY/deploy.sh" "$release/deploy.sh"
            rm -f "$UPLOAD_DIRECTORY/compose.production.yml" "$UPLOAD_DIRECTORY/deploy.sh"
            rmdir "$UPLOAD_DIRECTORY"
            sudo -n bash "$release/deploy.sh" "$IMAGE_REGISTRY" "$GITHUB_SHA"
      - name: Remove temporary SSH private key
        if: always()
        run: rm -f "$RUNNER_TEMP/shsg_deploy_key"
